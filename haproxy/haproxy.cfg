global
  log stdout format raw local0
  maxconn 1024

defaults
  log global
  timeout connect 5s
  timeout client 60s
  timeout server 60s

frontend postgres_writer
  bind *:5432
  mode tcp
  default_backend patroni_primary

backend patroni_primary
  mode tcp
  option httpchk
  http-check connect port 8008
  http-check send meth GET uri /primary ver HTTP/1.1 hdr Host patroni
  http-check expect status 200
  server pg-ha-1 172.31.4.103:5432 check port 8008 inter 2s fall 2 rise 2 on-marked-down shutdown-sessions
  server pg-ha-2 172.31.6.248:5432 check port 8008 inter 2s fall 2 rise 2 on-marked-down shutdown-sessions
  server pg-ha-3 172.31.5.186:5432 check port 8008 inter 2s fall 2 rise 2 on-marked-down shutdown-sessions
